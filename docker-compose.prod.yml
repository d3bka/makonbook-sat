# Production stack for the existing PostgreSQL database on the VPS.
#
# This compose file DOES NOT start PostgreSQL. The database container must already
# be attached to the external network below. Set DB_HOST in .env to its Docker DNS
# name, or attach it with the alias "db".
#
# Deploy one MakonBook UI stack at a time. Do not run this stack together with the
# replacement/new UI stack when both bind ports 80 and 443.

services:
  web:
    image: ${APP_IMAGE:-nazacd/makonbook-old:latest}
    pull_policy: always
    restart: always
    container_name: makonbook-old-web
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - logs:/app/logs
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-1}
      COLLECTSTATIC_ON_START: ${COLLECTSTATIC_ON_START:-1}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-90}
      GUNICORN_CMD_ARGS: >-
        --workers ${GUNICORN_WORKERS:-3}
        --timeout ${GUNICORN_TIMEOUT:-120}
        --max-requests 1000
        --max-requests-jitter 50
        --worker-tmp-dir /dev/shm
    networks:
      - sat_makon_network
    expose:
      - "8000"

  telegram-bot:
    image: ${APP_IMAGE:-nazacd/makonbook-old:latest}
    pull_policy: always
    restart: always
    container_name: makonbook-old-telegram-bot
    command: python manage.py run_telegram_bot
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      RUN_MIGRATIONS: 0
      COLLECTSTATIC_ON_START: 0
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-90}
    networks:
      - sat_makon_network
    depends_on:
      - web

  nginx:
    image: nginx:alpine
    restart: always
    container_name: makonbook-old-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    networks:
      - sat_makon_network
    depends_on:
      - web
    command: >-
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot
    restart: always
    container_name: makonbook-old-certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

volumes:
  static_files:
  media_files:
  logs:
  certbot_conf:
  certbot_webroot:

networks:
  sat_makon_network:
    external: true
