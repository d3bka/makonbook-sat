{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ status_code }} · {{ error_title }} · MakonBook</title>
  <link rel="stylesheet" href="{% static 'assets/css/makon-theme.css' %}">
  <link rel="stylesheet" href="{% static 'assets/css/makon-pages.css' %}">
  <style>
    :root {
      --error-bg: #f8f5ff;
      --error-card: rgba(255,255,255,.86);
      --error-text: #160c2d;
      --error-muted: #5b5570;
      --error-border: rgba(124,58,237,.18);
    }
    html[data-theme="dark"] {
      --error-bg: #070313;
      --error-card: rgba(18,10,42,.86);
      --error-text: #ffffff;
      --error-muted: #c4b5fd;
      --error-border: rgba(196,181,253,.22);
    }
    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--error-text);
      background:
        radial-gradient(circle at top left, rgba(168,85,247,.24), transparent 34%),
        radial-gradient(circle at bottom right, rgba(14,165,233,.16), transparent 34%),
        var(--error-bg);
      display: grid;
      place-items: center;
      padding: 28px;
      box-sizing: border-box;
    }
    .error-shell {
      width: min(920px, 100%);
      border: 1px solid var(--error-border);
      border-radius: 32px;
      background: var(--error-card);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 90px rgba(88,28,135,.18);
      overflow: hidden;
    }
    .error-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 26px 30px;
      background: linear-gradient(135deg, #5b21b6, #8b5cf6, #d946ef);
      color: #fff;
    }
    .error-brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-weight: 950;
      font-size: 1.25rem;
      letter-spacing: -.03em;
    }
    .error-logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.22);
    }
    .error-code-pill {
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.22);
      font-weight: 900;
    }
    .error-body {
      padding: clamp(34px, 6vw, 70px);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 28px;
      align-items: center;
    }
    .error-kicker {
      display: inline-flex;
      width: max-content;
      padding: 9px 14px;
      border-radius: 999px;
      color: #7c3aed;
      background: rgba(124,58,237,.10);
      font-size: .78rem;
      font-weight: 950;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    html[data-theme="dark"] .error-kicker { color: #d8b4fe; background: rgba(216,180,254,.12); }
    .error-body h1 {
      margin: 0 0 14px;
      font-size: clamp(2.4rem, 6vw, 5rem);
      line-height: .95;
      letter-spacing: -.07em;
    }
    .error-body p {
      margin: 0;
      max-width: 560px;
      color: var(--error-muted);
      font-size: 1.07rem;
      line-height: 1.65;
      font-weight: 650;
    }
    .error-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }
    .error-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      border: 0;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(135deg, #7c3aed, #d946ef);
      font-weight: 900;
      box-shadow: 0 18px 44px rgba(124,58,237,.24);
    }
    .error-btn.secondary {
      color: var(--error-text);
      background: rgba(124,58,237,.08);
      border: 1px solid var(--error-border);
      box-shadow: none;
    }
    .error-visual {
      width: clamp(120px, 20vw, 210px);
      height: clamp(120px, 20vw, 210px);
      border-radius: 36px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(124,58,237,.20), rgba(217,70,239,.16)),
        rgba(255,255,255,.26);
      border: 1px solid var(--error-border);
      font-size: clamp(3rem, 9vw, 6rem);
      font-weight: 1000;
      color: #7c3aed;
    }
    html[data-theme="dark"] .error-visual { color: #e9d5ff; background: rgba(255,255,255,.06); }
    @media (max-width: 720px) {
      .error-body { grid-template-columns: 1fr; }
      .error-visual { display: none; }
      .error-top { align-items: flex-start; flex-direction: column; }
    }
  </style>
  <link rel="stylesheet" href="{% static 'assets/css/makon-small-device.css' %}">
</head>
<body>
  <main class="error-shell" role="main">
    <div class="error-top">
      <div class="error-brand">
        <div class="error-logo">SAT</div>
        <span>MakonBook</span>
      </div>
      <div class="error-code-pill">HTTP {{ status_code }}</div>
    </div>
    <section class="error-body">
      <div>
        <div class="error-kicker">{{ error_title }}</div>
        <h1>{{ error_headline }}</h1>
        <p>{{ error_message }}</p>
        <div class="error-actions">
          <a class="error-btn" href="/sat/">Go to dashboard</a>
          <a class="error-btn secondary" href="javascript:history.back()">Go back</a>
        </div>
      </div>
      <div class="error-visual" aria-hidden="true">{{ status_code }}</div>
    </section>
  </main>
</body>
</html>
