<div class="theme-switcher" data-theme-switcher>
  <button class="theme-toggle" type="button" data-theme-toggle aria-haspopup="true" aria-expanded="false" aria-label="Change color theme">
    <span class="theme-toggle-icon" data-theme-icon aria-hidden="true">◐</span>
    <span class="theme-toggle-label" data-theme-label>System</span>
  </button>
  <div class="theme-menu" data-theme-menu role="menu" aria-label="Theme options">
    <button type="button" data-theme-choice="system" role="menuitemradio" aria-checked="true">
      <span>◐</span>
      <strong>System</strong>
    </button>
    <button type="button" data-theme-choice="light" role="menuitemradio" aria-checked="false">
      <span>☀</span>
      <strong>Light</strong>
    </button>
    <button type="button" data-theme-choice="dark" role="menuitemradio" aria-checked="false">
      <span>☾</span>
      <strong>Dark</strong>
    </button>
  </div>
</div>
