<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AP Classes{% endblock %}</title>
  <style>body{font-family:Arial,sans-serif;margin:0;background:#f6f7fb;color:#111827}.wrap{max-width:1100px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}.btn{display:inline-block;padding:10px 14px;border-radius:10px;background:#111827;color:white;text-decoration:none;border:0;cursor:pointer}.btn.secondary{background:#e5e7eb;color:#111827}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;background:#e5e7eb}.badge.live{background:#dcfce7;color:#166534}.badge.closed{background:#fee2e2;color:#991b1b}.muted{color:#6b7280}.question{border-top:1px solid #eee;padding-top:14px;margin-top:14px}.choice{display:block;margin:8px 0}.frq-page img{max-width:100%;border:1px solid #ddd;border-radius:10px}.messages{margin-bottom:16px}.messages div{padding:10px 12px;background:#eef2ff;border-radius:10px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}input[type=file],input[type=number],input[type=text]{padding:8px;border:1px solid #d1d5db;border-radius:8px}</style>
  {% include 'base/responsive_css.html' %}
</head>
<body><div class="wrap"><h1><a href="{% url 'apclasses:event_list' %}" style="color:#111827;text-decoration:none;">AP Classes</a></h1>{% if messages %}<div class="messages">{% for message in messages %}<div>{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}</div></body>
</html>
