# =============================================================================
# Edge nginx config for the makonbook production stack.
#
# This container owns :80/:443 on the VPS and is the ONLY internet-facing proxy.
# It terminates TLS for two independent sites off one SAN certificate:
#
#   makonbook.uz  / www.makonbook.uz   -> web:8000            (this Django app)
#   sat-makon.uz  / www.sat-makon.uz   -> sat-makon-site:80   (static landing site)
#
# sat-makon-site lives in its own Compose project (/opt/sat-makon/site) and is
# reached over the shared external network sat_makon_network. It has no certbot
# of its own by design — the cert lineage below covers all four names.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.
# =============================================================================

# Block direct IP access and unknown Host headers.
server {
    listen 80 default_server;
    listen 443 default_server ssl;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# ---------------------------------------------------------------------------
# makonbook.uz — Django application
# ---------------------------------------------------------------------------

# HTTP: serve ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    server_name makonbook.uz www.makonbook.uz;

    # Let's Encrypt webroot challenge (shared certbot_webroot volume)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name makonbook.uz www.makonbook.uz;
    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        application/rss+xml
        application/vnd.ms-fontobject
        application/font-sfnt
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml;
    gzip_static on;
    gunzip on;
    etag on;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # SSL — Let's Encrypt certs live in the certbot_conf volume mounted at /etc/letsencrypt.
    # The cert covers all four names; the live dir is named after the first -d domain.
    ssl_certificate /etc/letsencrypt/live/makonbook.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makonbook.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Docker DNS resolver. The upstream MUST stay in a variable: with a literal
    # proxy_pass, nginx resolves at startup and refuses to boot whenever the
    # backend is down — on this shared edge that would take sat-makon.uz offline
    # too. The variable form resolves lazily and degrades to 502 instead.
    resolver 127.0.0.11 valid=30s;
    set $upstream http://web:8000;

    location /static/ {
        alias /app/staticfiles/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    location /media/ {
        alias /app/media/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required: settings.py sets SECURE_PROXY_SSL_HEADER and SECURE_SSL_REDIRECT.
        # Without this header Django redirects to https forever -> redirect loop.
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# ---------------------------------------------------------------------------
# sat-makon.uz — static landing site (sat-makon-site container, internal :80)
# ---------------------------------------------------------------------------

# HTTP: serve ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    server_name sat-makon.uz www.sat-makon.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://sat-makon.uz$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sat-makon.uz www.sat-makon.uz;
    client_max_body_size 1m;

    # Same cert lineage as makonbook.uz — the SAN cert already covers sat-makon.uz.
    ssl_certificate /etc/letsencrypt/live/makonbook.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makonbook.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # www -> apex
    if ($host = www.sat-makon.uz) {
        return 301 https://sat-makon.uz$request_uri;
    }

    # Docker DNS, so restarting sat-makon-site doesn't require an nginx reload.
    resolver 127.0.0.11 valid=30s;
    set $site_upstream http://sat-makon-site:80;

    location / {
        proxy_pass $site_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
