# Temporary HTTP-only configuration used by init-letsencrypt.sh, so nginx can
# boot before any certificate exists. All four names on the SAN certificate are
# listed: ACME validates each one separately, and sat-makon.uz must be reachable
# here too or it drops off the certificate.
server {
    listen 80 default_server;
    server_name makonbook.uz www.makonbook.uz sat-makon.uz www.sat-makon.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "MakonBook certificate bootstrap is running.\n";
        add_header Content-Type text/plain;
    }
}
