# Temporary HTTP-only configuration used by init-letsencrypt.sh.
server {
    listen 80 default_server;
    server_name makonbook.uz www.makonbook.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "MakonBook certificate bootstrap is running.\n";
        add_header Content-Type text/plain;
    }
}
