# Reject requests with an unknown Host header.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# ACME challenge and HTTP -> HTTPS redirect.
server {
    listen 80;
    server_name makonbook.uz www.makonbook.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://makonbook.uz$request_uri;
    }
}

# Canonical redirect from www to the apex domain.
server {
    listen 443 ssl http2;
    server_name www.makonbook.uz;

    ssl_certificate /etc/letsencrypt/live/makonbook.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makonbook.uz/privkey.pem;

    return 301 https://makonbook.uz$request_uri;
}

# Main application.
server {
    listen 443 ssl http2;
    server_name makonbook.uz;

    client_max_body_size 100M;

    ssl_certificate /etc/letsencrypt/live/makonbook.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/makonbook.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $django_upstream http://web:8000;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
    }

    location /media/ {
        alias /app/media/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public" always;
    }

    location / {
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
