services:
  db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups:ro
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-makonbook_sat}
      POSTGRES_USER: ${DB_USER:-makonbook_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-makonbook_user} -d ${DB_NAME:-makonbook_sat}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    restart: always
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
      - logs:/app/logs
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      REGISTRATION_RATE_LIMIT_CACHE_URL: ${REGISTRATION_RATE_LIMIT_CACHE_URL:-redis://redis:6379/3}
      GUNICORN_CMD_ARGS: --workers 3 --timeout 120 --max-requests 1000 --max-requests-jitter 50 --worker-tmp-dir /dev/shm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery-worker:
    build: .
    restart: always
    command: celery -A satmakon worker --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    volumes:
      - media_files:/app/media
      - logs:/app/logs
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
      RUN_MIGRATIONS: 0
      COLLECTSTATIC_ON_START: 0
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  telegram-bot:
    profiles: ["bot"]
    build: .
    restart: always
    command: python manage.py run_telegram_bot
    volumes:
      - logs:/app/logs
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_HOST: db
      DB_PORT: 5432
      RUN_MIGRATIONS: 0
      COLLECTSTATIC_ON_START: 0
    depends_on:
      db:
        condition: service_healthy

  nginx:
    profiles: ["edge"]
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  logs:
